{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="theme-color" content="#6d4aff">
  <title>{% block title %}VibeConnect{% endblock %}</title>
  {# Apply the saved theme BEFORE the page paints, so there is no light/dark flash #}
  <script>
    (function () {
      try {
        var t = localStorage.getItem('vc-theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  {% block head %}{% endblock %}
</head>
<body data-me="{{ request.user.username }}" class="{% block body_class %}{% endblock %}">
  {% include 'partials/icons.html' %}
  {% block body %}{% endblock %}
  <div id="toast-stack" aria-live="polite" aria-atomic="false"></div>
  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/ui.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
